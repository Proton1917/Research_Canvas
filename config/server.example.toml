host = "127.0.0.1"
port = 8787
database = ".runtime/data/research-canvas.sqlite3"
temporary_directory = "tmp/backend"
frontend_directory = "dist"
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:8787", "http://127.0.0.1:8787"]
max_request_bytes = 33554432
pdf_extract_timeout_seconds = 45

[provider]
protocol = "anthropic_messages"
base_url = "http://127.0.0.1:43177/v1"
# 本机客户端匹配标记；上游 OAuth 凭据由 Router 管理。
headers = { authorization = "Bearer router-local-client", anthropic-version = "2023-06-01" }
default_model = "cc/gemini-3.8-flash-high"
allowed_models = ["cc/gemini-3.8-flash-high"]
request_timeout_seconds = 180
max_output_tokens = 4096
models_cache_seconds = 300

[prompts]
discussion = "config/prompts/discussion.txt"
rewrite = "config/prompts/rewrite.txt"
relation = "config/prompts/relation.txt"
canvas = "config/prompts/canvas.txt"
