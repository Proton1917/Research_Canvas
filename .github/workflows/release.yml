name: 发行包构建与验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 编译发行界面
    runs-on: ubuntu-22.04
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.runtime/yarn-cache
      YARN_GLOBAL_FOLDER: ${{ github.workspace }}/.runtime/yarn-global
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 安装锁定依赖并编译
        run: |
          node .yarn/releases/yarn-4.7.0.cjs install --immutable
          node .yarn/releases/yarn-4.7.0.cjs build
          python scripts/collect_licenses.py frontend --output .runtime/frontend-licenses.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend
          path: |
            dist/
            .runtime/frontend-licenses.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  packages:
    name: ${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            executable: research-canvas.exe
            extension: zip
            rustflags: '-C target-feature=+crt-static'
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            executable: research-canvas
            extension: zip
            rustflags: ''
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: research-canvas
            extension: zip
            rustflags: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: research-canvas
            extension: tar.gz
            rustflags: ''
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: ${{ github.workspace }}/.runtime/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: '1.96.0'
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend
          path: .
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 准备 Rust 和验证依赖
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target ${{ matrix.target }}
          python -m pip install --target .runtime/python tomli-w==1.2.0
      - name: 安装 Linux PDF 工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: 安装 macOS PDF 工具
        if: runner.os == 'macOS'
        run: command -v pdftotext || brew install poppler
      - name: 安装 Windows PDF 工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .runtime/poppler | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/oschwartz10612/poppler-windows/releases/download/v25.07.0-0/Release-25.07.0-0.zip' -OutFile .runtime/poppler.zip
          Expand-Archive .runtime/poppler.zip .runtime/poppler
          $pdfTool = Get-ChildItem .runtime/poppler -Filter pdftotext.exe -Recurse | Select-Object -First 1
          if ($null -eq $pdfTool) { throw 'Poppler 压缩包中缺少 pdftotext.exe' }
          Add-Content -Path $env:GITHUB_PATH -Value $pdfTool.Directory.FullName
      - name: 编译发行程序
        id: native-build
        run: |
          release_build_started=$(date +%s)
          cargo build --release --locked --target ${{ matrix.target }}
          printf 'seconds=%s\n' "$(( $(date +%s) - release_build_started ))" >> "$GITHUB_OUTPUT"
      - name: 执行原生测试
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: 组装发行包
        run: python scripts/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --platform ${{ matrix.platform }}
      - name: 验证解压后的程序
        run: python scripts/release_smoke.py --archive .runtime/releases/research-canvas-*-${{ matrix.platform }}.${{ matrix.extension }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            .runtime/releases/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: 保存运行日志
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.platform }}
          path: .runtime/logs/release-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: 清理构建目录
        if: success() && fromJSON(steps.native-build.outputs.seconds) <= 170
        run: cargo clean
